name: Apply WYSIWYG preview geometry fix

on:
  push:
    branches:
      - fix/wysiwyg-preview-output
    paths:
      - .github/apply_wysiwyg_preview.py
      - .github/workflows/apply-wysiwyg-preview.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply WYSIWYG patch
        run: python .github/apply_wysiwyg_preview.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q . -x 'tmp|\.git|\.venv'
      - name: Test
        run: python -m pytest -q
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movieprint_gui.py tests/test_wysiwyg_preview_geometry.py
          git diff --cached --check
          git commit -m "Render preview with final output geometry"
          git push origin HEAD:${GITHUB_REF_NAME}
