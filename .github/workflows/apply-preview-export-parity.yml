name: Apply preview/export parity fix

on:
  push:
    branches:
      - agent/fix-preview-export-parity
    paths:
      - .github/apply_preview_export_parity.py
      - .github/workflows/apply-preview-export-parity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted patch
        run: |
          if ! python .github/apply_preview_export_parity.py > .github/patch_error.txt 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/patch_error.txt
            git commit -m "Capture parity patch diagnostic"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit 1
          fi
          rm -f .github/patch_error.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Remove one-shot patch tooling
        run: rm .github/apply_preview_export_parity.py .github/workflows/apply-preview-export-parity.yml
      - name: Compile
        run: python -m compileall -q . -x 'tmp|\.git|\.venv'
      - name: Test
        run: python -m pytest -q
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix preview and export render parity"
          git push origin HEAD:${GITHUB_REF_NAME}
